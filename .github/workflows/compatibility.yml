name: Axolotl protocol compatibility

on:
  push:
    paths: ['src/**', 'tests/**', 'tools/**', 'plugin.yml', '.github/workflows/compatibility.yml', 'examples/CustomiesShowcase/src/**', 'examples/CustomiesShowcase/tests/**', 'examples/CustomiesShowcase/resource_pack/**', 'website/authoring*', 'website/migration*', 'website/check-*.php', 'website/package*.json']
  pull_request:
    paths: ['src/**', 'tests/**', 'tools/**', 'plugin.yml', '.github/workflows/compatibility.yml', 'examples/CustomiesShowcase/src/**', 'examples/CustomiesShowcase/tests/**', 'examples/CustomiesShowcase/resource_pack/**', 'website/authoring*', 'website/migration*', 'website/check-*.php', 'website/package*.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release-26.60
            repo: axolotl-pm/PocketMine-MP
            host: f5e6a67fdf2108cf63196c06db1eb5c0d400d4c8
            protocol: ''
          - name: stable-26.60
            repo: axolotl-pm/PocketMine-MP
            host: 7831952d6a970d1700ca82742ab2ac4dbe61ff80
            protocol: ''
          - name: protocol-master-26.60
            repo: axolotl-pm/PocketMine-MP
            host: 7831952d6a970d1700ca82742ab2ac4dbe61ff80
            protocol: 'dev-master#64eae48f05b8d1e4d474ead89711600996f1c5af'
          # Multi-version host: 32 client protocols, Bedrock 1.20.0 to 1.26.60.
          - name: nethergames-multiversion
            repo: NetherGamesMC/PocketMine-MP
            host: eaa2e58156e71e7a10093cffc98b02e1023f05ee
            protocol: ''
    name: ${{ matrix.name }} / PHP 8.4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.host }}
          path: .compat/host
      - uses: axolotl-pm/setup-php-action@1.0.0
        with:
          php-version: '8.4'
          install-path: './bin'
          pm-version-major: 5
      - name: Install locked host dependencies
        working-directory: .compat/host
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - name: Test pinned protocol development commit
        if: matrix.protocol != ''
        working-directory: .compat/host
        env:
          PROTOCOL_REF: ${{ matrix.protocol }}
        run: composer require "axolotl-pm/bedrock-protocol:$PROTOCOL_REF" --update-no-dev --prefer-dist --no-interaction --no-progress
      - name: Host contract report
        run: php tools/doctor.php .compat/host
      - name: State, cache and wire codec regressions
        run: php tests/protocol.php .compat/host
      - name: Inventory persistence across 16 fresh processes
        run: php tests/restarts.php .compat/host
      - name: Native chest and player data across server restarts
        run: python3 tests/restart-server.py .compat/host --cycles 3
      - name: Mojang 26.60 components and command removal
        run: php tests/mc2660.php .compat/host
      - name: Bedrock version gates
        run: php tests/versions.php .compat/host
      - name: Multi-version registries, palette order and join packets
        run: php -d memory_limit=2G tests/multiversion.php .compat/host
      - name: Showcase and documentation PHP integration
        run: php examples/CustomiesShowcase/tests/guide.php .compat/host
      - name: Slab placement and mesh collision against vanilla
        run: |
          php examples/CustomiesShowcase/tests/shapes.php .compat/host
          git diff --exit-code -- website/shape-fixtures.json
      - name: Install pinned migration parser and archive tools
        run: npm ci --prefix website --ignore-scripts
      - name: Generated PHP classes against the host
        run: |
          node website/authoring.test.cjs --fixtures .compat/authoring.json
          php website/check-php.php .compat/host .compat/authoring.json
          node website/migration.test.cjs --fixtures .compat/migration.json
          php website/check-migration.php .compat/host .compat/migration.json
